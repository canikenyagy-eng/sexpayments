[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -p no:anyio -m "not slow"
markers =
    slow: тесты с долгим ожиданием (TTL expiry и т.п.), пропускаются по умолчанию
    anyio: совместимый маркер (фактически обрабатывается pytest-asyncio)
