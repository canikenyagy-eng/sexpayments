        100% { stroke-dashoffset: -214; opacity: .2; }
      }
      @keyframes mark {
        0%, 12% { stroke-dashoffset: 126; opacity: 0; }
        50%, 76% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -126; opacity: 0; }
      }
      @keyframes flow {
        0%, 24% { opacity: 0; transform: scaleX(.72); }
        48%, 78% { opacity: 1; transform: scaleX(1); }
        100% { opacity: 0; transform: scaleX(.72); }
      }
    </style>
  </defs>
  <rect width="96" height="96" rx="48" fill="#0D0D0D"/>
