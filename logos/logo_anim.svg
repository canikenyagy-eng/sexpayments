<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spGrad" x1="17" y1="15" x2="82" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6A38F"/>
      <stop offset="0.52" stop-color="#8B1538"/>
      <stop offset="1" stop-color="#F0BEAA"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ring {
        stroke-dasharray: 214;
        stroke-dashoffset: 214;
        animation: ring 1.8s ease-in-out infinite;
      }
      .mark {
        stroke-dasharray: 126;
        stroke-dashoffset: 126;
        animation: mark 1.8s ease-in-out infinite;
      }
      .flow {
