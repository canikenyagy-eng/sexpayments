# Custom queries on top of the default postgres_exporter set.
#
# Focused on signals that matter for PrimePay:
#  - connection pool pressure (we run max_connections=300)
#  - table bloat / size on the write-heavy tables (orders, ledger_entries, audit_log)
#  - long-running transactions (block deploys and migrations)
#  - waiting locks (early-warning for deadlocks)

pg_connections_by_state:
  query: |
    SELECT state, count(*) AS count
    FROM pg_stat_activity
    WHERE state IS NOT NULL
    GROUP BY state
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - count:
        usage: "GAUGE"
        description: "Number of connections in this state"

pg_long_running_transactions:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND xact_start IS NOT NULL
      AND now() - xact_start > interval '1 minute'
  metrics:
    - count:
        usage: "GAUGE"
        description: "Transactions running for more than 1 minute"

pg_blocked_queries:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
  metrics:
    - count:
        usage: "GAUGE"
        description: "Queries currently waiting on a lock"

pg_table_size_bytes:
  # Top-20 largest user tables by total size (data + indexes + TOAST).
  # Avoids hardcoding table names — dashboards just topk() over the result.
  query: |
    SELECT
      schemaname AS schema,
      relname AS table,
      pg_total_relation_size(schemaname || '.' || relname) AS bytes
    FROM pg_stat_user_tables
    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
    ORDER BY pg_total_relation_size(schemaname || '.' || relname) DESC
    LIMIT 20
  metrics:
    - schema:
        usage: "LABEL"
    - table:
        usage: "LABEL"
    - bytes:
        usage: "GAUGE"
        description: "Total size of the table including indexes and TOAST"
